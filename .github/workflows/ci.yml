# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# other run (pushes to main) gets its own group from its run id, so a later
# merge neither cancels nor replaces a pending one and every merge keeps its
# own result. Merges do not wait for CI either way (ADR-0046).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format and lint sync
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make fmt-check lint-sync deps-check doc

  # Linux runs on GitHub-hosted runners. macOS arm64 runs on the org's
  # self-hosted Apple silicon runner (owner decision of 2026-11-08 on
  # karyos#623): the hosted macos-14 configuration is not available to the
  # org, so that job never started. Until that runner is registered the
  # macOS job waits in the queue; the Linux jobs are not held by it.
  test:
    name: Clippy and test (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64, quant-macos]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners ship no usable toolchain (a root owned
      # /usr/local/rustup, or a Homebrew rustup without proxies): install a
      # per-user rustup and the channel pinned in rust-toolchain.toml.
      - name: Install Rust
        run: |
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" toolchain install
      - run: rustup show active-toolchain
      - run: make lint test build-release

  loom:
    name: Loom models
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make loom

  miri:
    name: Miri (karyos-sys)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component miri,rust-src
      - run: make miri

  deny:
    name: Licences and sources
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Separate from `deny`: a RustSec database update can turn this job red
  # with no change in the repository, which must not hide licence, ban or
  # source results (karyos#933). Not part of the offline `make pre-push`.
  advisories:
    name: Advisories
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
