# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# other run (pushes to main) gets its own group from its run id, so a later
# merge neither cancels nor replaces a pending one and every merge keeps its
# own result. Merges do not wait for CI either way (ADR-0046).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format and lint sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make fmt-check lint-sync deps-check doc

  test:
    name: Clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make lint test build-release

  loom:
    name: Loom models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make loom

  miri:
    name: Miri (karyos-sys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component miri,rust-src
      - run: make miri

  deny:
    name: Licences and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
