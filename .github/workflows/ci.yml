# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every
# other run (pushes to main) gets its own group from its run id, so a later
# merge neither cancels nor replaces a pending one and every merge keeps its
# own result. Merges do not wait for CI either way (ADR-0046).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format and lint sync
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain
      - run: make fmt-check lint-sync deps-check doc

  # The C header is generated by cbindgen, a maintainer tool installed at
  # its exact version for this job only, never a dependency (karyos#697).
  header:
    name: Generated C header
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo install cbindgen --version 0.29.4 --locked
      - run: make header-check

  # Every job runs on GitHub-hosted runners. karyos is public, so the macOS
  # arm64 job no longer uses the org's self-hosted Mac (which replaced the
  # hosted macos-14 job by the owner decision of 2026-11-08 on karyos#623):
  # the self-hosted group stopped allowing public repositories on
  # 2026-11-23 (karyos-market-data#104).
  test:
    name: Clippy and test (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # karyos is public, so the Mac job runs on a GitHub-hosted runner, not
      # on a self-hosted machine. It builds with Homebrew llvm@23, as the
      # local macOS setup does, and keeps the user rustup first on PATH.
      - if: runner.os == 'macOS'
        run: |
          brew list llvm@23 >/dev/null 2>&1 || brew install llvm@23
          echo "/opt/homebrew/opt/llvm@23/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The runner provides rustup; install the channel pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup show active-toolchain
      - run: make lint test build-release

  # libkaryos as its own artifact (owner item 44; karyos#700): the two
  # release archives built from the commit, libkaryos without karyosd,
  # and the conformance suite run against the libkaryos archive. Nothing
  # is signed or published here; that is the release key custodian's.
  libkaryos-artifact:
    name: libkaryos release artifact (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - run: make libkaryos-release-check

  loom:
    name: Loom models
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make loom

  # One job per part (karyos#161): `make miri` takes about 10 h on a shared
  # Linux host, karyos-sys alone near the 6 h job limit, so karyos-sys runs
  # as two shards: its log buffer tests and the rest.
  miri:
    name: Miri (${{ matrix.part }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [miri-sys-log-buffer, miri-sys-rest, miri-ffi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component miri,rust-src
      - run: make ${{ matrix.part }}

  deny:
    name: Licences and sources
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses bans sources

  # Separate from `deny`: a RustSec database update can turn this job red
  # with no change in the repository, which must not hide licence, ban or
  # source results (karyos#933). Not part of the offline `make pre-push`.
  advisories:
    name: Advisories
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories

  # The two Docker jobs of io-uring-backend.md IU-10 (karyos#641): the
  # functional io_uring suite under the narrow profile, which fails instead
  # of skipping, and Docker's default profile, under which the setup must be
  # denied with EPERM.
  uring:
    name: io_uring (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow seccomp profile
            env: KARYOS_URING_REQUIRED=1 KARYOS_LINUX_SECCOMP=ci/seccomp/io-uring.json
            filter: uring
          - name: default seccomp profile
            env: KARYOS_URING_EXPECT_DENIED=1
            filter: a_denying_seccomp_profile_is_reported_as_denied
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: env ${{ matrix.env }} scripts/linux-test.sh -p karyos-io --features uring --locked ${{ matrix.filter }}

  # The AF_XDP jobs of karyos#643 (af-xdp-backend.md section 10): the
  # backend's tests with the narrow privileges it needs (CAP_BPF,
  # CAP_NET_ADMIN, CAP_NET_RAW, CAP_PERFMON, CAP_IPC_LOCK; Docker's default
  # seccomp profile, which allows bpf with CAP_BPF; never --privileged),
  # failing instead of skipping, and Docker's default capabilities, under
  # which loading the program must be denied.
  xdp:
    name: AF_XDP (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: narrow capabilities
            env: KARYOS_XDP_REQUIRED=1 KARYOS_LINUX_CAPS=BPF,NET_ADMIN,NET_RAW,PERFMON,IPC_LOCK
            filter: xdp
          - name: default capabilities
            env: KARYOS_XDP_EXPECT_DENIED=1
            filter: a_missing_privilege_is_reported_as_denied
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: env ${{ matrix.env }} scripts/linux-test.sh -p karyos-io --features xdp --locked ${{ matrix.filter }}

  runner-probe:
    name: Runner probe (qs-shared)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, qs-shared]
    steps:
      - run: echo "qs-shared runner reachable on $(uname -a)"
