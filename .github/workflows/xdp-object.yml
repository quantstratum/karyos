# SPDX-License-Identifier: Apache-2.0
# The independent second build of the XDP object (ADR-0038; the aya R8
# record, "Where it is reproduced"): rebuilds bpf/karyos-xdp with
# scripts/xdp-object.sh in the pinned container and fails unless the
# object's SHA-256 equals the committed manifest's. Run by hand; its run
# is named in the pull request that changes the object.
name: XDP object

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build in the pinned container
        run: scripts/xdp-object.sh build "$RUNNER_TEMP/xdp"
      - name: Compare with the committed object
        run: |
          want="$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' crates/karyos-io/src/xdp/karyos_xdp.manifest.toml)"
          got="$(sha256sum "$RUNNER_TEMP/xdp/karyos_xdp.bpf.o" | cut -d' ' -f1)"
          echo "manifest $want, rebuilt $got"
          test -n "$want" && test "$want" = "$got"
          cmp "$RUNNER_TEMP/xdp/karyos_xdp.bpf.o" crates/karyos-io/src/xdp/karyos_xdp.bpf.o
