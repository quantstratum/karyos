# SPDX-License-Identifier: Apache-2.0
# Licence and source policy for the resolved dependency graph (ADR-0033).
# cargo-deny does not prove the absence of native build steps; build scripts
# and linkage are reviewed separately for every new dependency.

[graph]
all-features = true

[licenses]
# Dev and build dependencies are part of the reviewed graph (ADR-0033).
include-dev = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# `foldhash` 0.2.0 (Zlib) enters through `hashbrown`'s `default-hasher`,
# which `aya` 0.16.0 enables itself: the scoped exception of the aya R8
# record (quantstratum-docs karyos/reviews/dependency-admission-aya-af-xdp.md,
# condition 2). A second consumer of `default-hasher` is a scope change
# with its own record.
exceptions = [
    { allow = ["Zlib"], crate = "foldhash@0.2.0" },
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
