# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-cluster"
description = "Consensus module, service container, snapshots and guards."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["ipc", "messaging", "low-latency", "shared-memory", "trading"]
categories = ["network-programming", "concurrency"]

[dependencies]
karyos-archive.workspace = true
karyos-codec.workspace = true
thiserror.workspace = true
# The rebuild identity's derivation (ADR-0123 decision 2), with backups only.
sha2 = { workspace = true, optional = true }

[features]
# Backups to remote storage and a rebuild from them (`backup`): control
# path only. Off by default; karyos-tools enables it, and
# scripts/check-cluster-backup-graph.sh keeps it out of every data-path
# graph.
backup = ["dep:sha2"]

[[test]]
name = "backup"
required-features = ["backup"]

[dev-dependencies]
# The counting allocator of the client's allocation test (karyos#720).
karyos-sys = { workspace = true, features = ["alloc-count"] }
# The calibration and UTC reference records of tests/c_time_evidence.rs.
karyos-trace.workspace = true

[lints]
workspace = true
