# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-io"
description = "Backend traits, the sockets backend, hardware timestamps and timed transmission; the uring and xdp features add the other backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["ipc", "messaging", "low-latency", "shared-memory", "trading"]
categories = ["network-programming", "concurrency"]

[features]
# The scripted `SocketOps` test double for tests of dependent crates; never
# enabled outside dev-dependencies.
test-hooks = []
# The optional `io_uring` backend (SPEC.md §16.4, owner item 2), Linux
# only: quantstratum-docs karyos/reviews/dependency-admission-io-uring.md.
uring = ["dep:io-uring"]
# The AF_XDP copy-mode backend (SPEC.md §16.3, owner item 3), Linux only:
# quantstratum-docs karyos/reviews/dependency-admission-aya-af-xdp.md.
xdp = ["dep:aya"]

[dependencies]
# The DRR of priority lanes (P2.4 l2); an internal edge the coordinator
# approved (ACS 14599 and 14655).
karyos-protocol.workspace = true
karyos-sys.workspace = true
thiserror.workspace = true

# The Linux sockets backend (`src/sockets/linux.rs`): socket setup, options,
# `sendmsg`, `sendmmsg` and `recvmsg` through `net` (owner decision O-1,
# quantstratum-docs: karyos/design/sockets-backend.md 11.0). Declared
# directly rather than through the workspace entry so that this crate asks
# for `net` only; no `event` (decision O-6).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "net"] }
# `IP_MULTICAST_ALL` and `IPV6_MULTICAST_ALL` off on a path socket
# (`src/linux_sys.rs`, owner item 12), which `rustix` 1.1.5 cannot set:
# the R8 record quantstratum-docs:
# karyos/reviews/dependency-admission-libc-linux-sockets.md, at the
# version `Cargo.lock` resolves, no feature.
libc = { version = "0.2.190", default-features = false }
# The `io_uring` ring of the `uring` feature (`src/uring/ring.rs`): the
# ADR-0033 family `io-uring`, resolution admitted under R8 at 0.7.x with no
# feature (quantstratum-docs: karyos/reviews/dependency-admission-io-uring.md).
io-uring = { version = "0.7.16", default-features = false, optional = true }
# The loader of the prebuilt XDP object of the `xdp` feature (ADR-0038):
# the ADR-0033 family `aya`, admitted under R8 at exactly 0.16.0 with no
# feature (quantstratum-docs: karyos/reviews/dependency-admission-aya-af-xdp.md).
aya = { version = "=0.16.0", default-features = false, optional = true }

[dev-dependencies]
# The counting allocator of the no allocation tests (`alloc_count`).
karyos-sys = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true

# The workspace lint set without `unsafe_code = "forbid"`, plus the unsafe
# rules of SPEC.md §14. Keep the clippy list in sync with the workspace.
[lints.rust]
missing_docs = "deny"
# `unsafe` only where a module expects it: `uring::ring` and, on Linux,
# `linux_sys` (SPEC.md §14; the io-uring and libc R8 records).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
