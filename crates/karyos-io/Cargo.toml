# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-io"
description = "Backend traits, the sockets backend, hardware timestamps and timed transmission; the uring and xdp features add the other backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
karyos-sys.workspace = true

# The workspace lint set without `unsafe_code = "forbid"`, plus the unsafe
# rules of SPEC.md §14. Keep the clippy list in sync with the workspace.
[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
