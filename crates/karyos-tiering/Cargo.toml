# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-tiering"
description = "The Archive's object storage client: offloaded sealed ranges on S3 over TLS 1.3 (A10, karyos#965)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The object storage admission record (quantstratum-docs:
# karyos/reviews/dependency-admission-object-storage.md, owner decision
# ACS 71206): `rusty-s3` and the agent record's HTTP and TLS stack, at
# these versions and features, in this crate only. `karyos-archive` does
# not depend on it, and it is not a default member (conditions 1 and 2).
[dependencies]
karyos-archive.workspace = true
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["graviola"] }
# `rusty-s3`'s `Bucket` takes a `url::Url`; `url` comes with it.
url = { version = "2", default-features = false, features = ["std"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
rustls-graviola = { version = "=0.4.0", default-features = false }
graviola = { version = "=0.4.2", default-features = false }
thiserror.workspace = true

[lints]
workspace = true
