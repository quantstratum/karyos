[package]
name = "karyos-bench"
description = "System benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fault injection into the wire process runs (`wire::process::Faults`), for
# the bench's own tests; never enabled outside dev-dependencies, so a
# measurement build refuses injected faults (coordinator, ACS 15309).
test-hooks = []
# The allocation build (M-9): the counting allocator of
# `karyos_sys::alloc_count` as the global allocator, and a count of the
# allocations inside both measured stages. Never used for timing: its
# binary refuses `measure`, and `analyze` refuses any result it produced
# (coordinator, ACS 15372). `scripts/measure.sh` builds it into its own
# target directory. Any build that enables it, `--all-features` included,
# is an allocation build and never a timing build; `karyos-bench
# build-info` says which a binary is, and measure.sh and `make
# timing-build-check` refuse to time any but `build timing`. The bench's
# self dev-dependency enables it too, so any build of its test or bench
# targets (`--all-targets`, `cargo test`) is an alloc-count binary.
alloc-count = ["karyos-sys/test-hooks"]
# The synthetic test profile (`wire::profile`, `Synthetic` of
# karyos-protocol): configurations `synthetic-<spin_ns>`, to check the
# harness end to end (measurement-harness.md §5.2). A build with it is
# never a timing build for a decision: its BUILD says `+synthetic`, `make
# timing-build-check` requires plain `timing`, and `analyze` makes every
# run of it report-only, its trusted runs included (ACS 15453).
synthetic = ["karyos-protocol/test-hooks"]

[dependencies]
karyos-sys.workspace = true
karyos-io.workspace = true
karyos-protocol.workspace = true
karyos-codec.workspace = true
karyos-client.workspace = true
karyos-driver.workspace = true
karyos-trace.workspace = true
karyos-archive.workspace = true
karyos-cluster.workspace = true
karyos-sim.workspace = true
karyos.workspace = true

[dev-dependencies]
# The raw trace export's page cost (R-CORE-13).
karyos-agent.workspace = true
# The bench itself with `test-hooks`, for the fault tests of tests/smoke.rs.
karyos-bench = { path = ".", features = ["test-hooks", "alloc-count", "synthetic"] }
criterion = { version = "=0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "micro"
harness = false

[lints]
workspace = true
