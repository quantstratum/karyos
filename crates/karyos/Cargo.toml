# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos"
description = "Public facade: re-exports the client, Archive and Cluster APIs and defines karyos::Error."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["ipc", "messaging", "low-latency", "shared-memory", "trading"]
categories = ["network-programming", "concurrency"]

[dependencies]
karyos-client.workspace = true
karyos-archive.workspace = true
karyos-cluster.workspace = true
# Only for `alloc-count`: the counting allocator lives there.
karyos-sys = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# `karyos::alloc_count`: a counting global allocator for test profiles
# (R-CORE-48, karyos#918). Unsupported in production builds.
alloc-count = ["dep:karyos-sys", "karyos-sys/alloc-count"]

[dev-dependencies]
# The versions test compares the facade's with the protocol's.
karyos-protocol.workspace = true
# The facade with `alloc-count`, for tests/alloc_count.rs.
karyos = { path = ".", features = ["alloc-count"] }

[lints]
workspace = true
