# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-agent"
description = "Per-host management agent: per-driver model and API v1 (ADR-0055)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Native TLS for karyos-exporter (karyos#887): off by default.
exporter-tls = ["dep:rustls", "dep:rustls-graviola"]

[dependencies]
karyos-archive.workspace = true
karyos-client.workspace = true
karyos-protocol.workspace = true
karyos-sys.workspace = true
karyos-trace.workspace = true
# The binary's stop on SIGTERM and SIGINT, a flag only (owner item 55,
# karyos#710; quantstratum-docs: karyos/reviews/dependency-admission-signal-hook-agent.md).
signal-hook.workspace = true
thiserror.workspace = true
# The exporter's TLS (karyos#887; quantstratum-docs:
# karyos/reviews/dependency-admission-exporter-tls.md, widening the agent
# HTTP stack record): `rustls` with the `rustls-graviola` provider, behind
# the `exporter-tls` feature only, off by default, so the default graph
# does not change.
rustls = { version = "=0.23.46", default-features = false, features = ["std"], optional = true }
rustls-graviola = { version = "=0.4.0", default-features = false, optional = true }

[dev-dependencies]
# The fixture product Cluster of the admin command tests (karyos#772): a
# ClusteredService in C10's service container. Tests only; the library
# does not depend on the Cluster (owner item 52).
karyos-cluster.workspace = true
karyos-driver.workspace = true
# The join parser's and the registry's properties (karyos#893).
proptest.workspace = true
# A busy table entry and a malformed record in the export's tests.
karyos-sys = { workspace = true, features = ["test-hooks"] }
# The test signing key of the journal's `--journal-trust` tests (ADR-0113),
# dev-dependencies only, as scripts/check-archive-test-hooks-absent.sh
# requires.
karyos-archive = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
