# SPDX-License-Identifier: Apache-2.0
#
# The wire compatibility matrix (R-CORE-36, karyos#732; quantstratum-docs:
# karyos/design/versions.md, "Compatibility"). Columns are versions tuples
# as `--versions` reports them; an entry is an ordered pair of columns and
# one surface (the roles are in `karyos_tools::compat::SURFACES`). A pair
# of the same column interoperates; a surface one side lacks is absent.
# `karyos-tools compat FROM TO` decides a pair from this file.
#
# Each new release adds its column, renames `main`'s values to it when they
# are the release's, and adds the entries its two-build gate observed
# (scripts/compat-test.sh). A test fails when this build's tuple is not the
# `main` column.

schema = "karyos-compat"
schema_version = 1

[[column]]
name = "0.1.0-alpha.2"
[column.versions]
admission = 2
frame = 1
c_abi = "0.1.1"
archive_control = 1
group_record = 1
capture_contract = 1

[[column]]
name = "main"
[column.versions]
admission = 6
frame = 1
c_abi = "0.1.8"
archive_control = 1
cluster_log = 1
group_record = 2
capture_contract = 1
archive_durable = 1
config = 1

# Admission: a driver admits only its own protocol version
# (crates/karyos-ffi/tests/connect.rs; conformance op.connect.other.version).
# Observed by scripts/compat-test.sh (its run, head and command:
# RELEASING.md, the wire compatibility matrix row): the refusal names the
# driver's version in neither direction (driver: None). From karyos#879 a
# main driver states its version in word 1 of the Refused, which a main
# client reads, but a 0.1.0-alpha.2 driver states none (word 1 is 0) and a
# 0.1.0-alpha.2 client does not read it. The first release pair with the
# change on both sides will show it.
[[entry]]
surface = "admission"
from = "main"
to = "0.1.0-alpha.2"
outcome = "refuse"
reason = "IncompatibleVersion: the 0.1.0-alpha.2 driver refuses main's protocol (observed at protocol 3; protocol 4 since karyos#740 and 5 since karyos#844 pending observation; observed: AttachError::IncompatibleVersion { driver: None }; a 0.1.0-alpha.2 driver's refusal states no version, karyos#879)"

[[entry]]
surface = "admission"
from = "0.1.0-alpha.2"
to = "main"
outcome = "refuse"
reason = "IncompatibleVersion: the main driver refuses protocol 2 and states its own protocol (observed at 3; 4 since karyos#740 and 5 since karyos#844 pending observation) in its refusal (karyos#879), which a 0.1.0-alpha.2 client does not read (observed: AttachError::IncompatibleVersion { driver: None })"

# Frame: the same frame version, 1, on both sides, which is not enough by
# itself (R-CORE-36). Observed by scripts/compat-test.sh (its run, head
# and command: RELEASING.md, the wire compatibility matrix row): a
# karyos:udp publication on one release's karyosd and a subscription on
# the other's, on loopback, 200 messages received whole and in order, in
# each direction.
[[entry]]
surface = "frame"
from = "main"
to = "0.1.0-alpha.2"
outcome = "interoperate"
reason = "observed by scripts/compat-test.sh: a main sender and a 0.1.0-alpha.2 receiver, 200 of 200 in order"

[[entry]]
surface = "frame"
from = "0.1.0-alpha.2"
to = "main"
outcome = "interoperate"
reason = "observed by scripts/compat-test.sh: a 0.1.0-alpha.2 sender and a main receiver, 200 of 200 in order"

# C ABI: owner item 48, exact 0.y and a library patch at least the
# header's. From is the header a client was compiled against, to the
# library it runs on. Observed by scripts/compat-test.sh (as above;
# scripts/compat-probe/c_abi.c): a client of one tree's karyos.h linked
# against the other tree's libkaryos applies the header's rule, and the
# one it accepts runs a driver through the calls both releases share.
[[entry]]
surface = "c_abi"
from = "0.1.0-alpha.2"
to = "main"
outcome = "interoperate"
reason = "observed by scripts/compat-test.sh: a 0.1.1 header's client on the main library (observed at 0.1.5; 0.1.6 since karyos#740 and 0.1.7 since karyos#844 and 0.1.8 since karyos#738 pending observation) accepts it (same 0.1 line, a higher patch) and runs a driver"

[[entry]]
surface = "c_abi"
from = "main"
to = "0.1.0-alpha.2"
outcome = "refuse"
reason = "observed by scripts/compat-test.sh: a main header's client (observed at 0.1.5; 0.1.6 since karyos#740 and 0.1.7 since karyos#844 and 0.1.8 since karyos#738 pending observation) on the 0.1.1 library refuses it at karyos_abi_version (patch 1 below the header's)"

# The Archive's control messages are reached only through an attached
# client, which admission refuses for this pair.
[[entry]]
surface = "archive_control"
from = "main"
to = "0.1.0-alpha.2"
outcome = "not_covered"
reason = "reached only through admission, which refuses this pair"

[[entry]]
surface = "archive_control"
from = "0.1.0-alpha.2"
to = "main"
outcome = "not_covered"
reason = "reached only through admission, which refuses this pair"

# Recordings on disk: the same schema versions, never read across these
# builds by a test.
[[entry]]
surface = "group_record"
from = "0.1.0-alpha.2"
to = "main"
outcome = "not_covered"
reason = "group records written by 0.1.0-alpha.2 (version 1) and read by main, which still reads version 1 as image 0 (ADR-0089, karyos#672), are not tested across builds"

[[entry]]
surface = "group_record"
from = "main"
to = "0.1.0-alpha.2"
outcome = "not_covered"
reason = "group records written by main (version 2, karyos#672) and read by 0.1.0-alpha.2, which reads version 1 only, are not tested"

[[entry]]
surface = "capture_contract"
from = "0.1.0-alpha.2"
to = "main"
outcome = "not_covered"
reason = "group journals captured by 0.1.0-alpha.2 and read by main are not tested"

[[entry]]
surface = "capture_contract"
from = "main"
to = "0.1.0-alpha.2"
outcome = "not_covered"
reason = "group journals captured by main and read by 0.1.0-alpha.2 are not tested"

[[not_covered]]
case = "0.1.0-alpha.1"
reason = "no column: admission protocol 1 was withdrawn by 0.1.0-alpha.2, and the release had no versions output to key a column on"

[[not_covered]]
case = "a main snapshot other than the one this file was written at"
reason = "an unreleased schema can change before its release; only the tuple of the main column is judged"

[[not_covered]]
case = "Windows"
reason = "no Karyos build runs on Windows"
