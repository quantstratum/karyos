# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-tools"
description = "The karyosd daemon and the operational binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
karyos-sys.workspace = true
karyos-io.workspace = true
karyos-protocol.workspace = true
karyos-codec.workspace = true
karyos-client.workspace = true
karyos-driver.workspace = true
karyos-trace.workspace = true
karyos-archive.workspace = true
karyos-cluster.workspace = true
karyos-feed.workspace = true
karyos-sim.workspace = true
karyos.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
karyos-agent.workspace = true

[features]
# Test-kit binaries (`karyos-admission-stub`), never in the product build.
test-hooks = []

[[bin]]
name = "karyosd"
path = "src/bin/karyosd.rs"

[[bin]]
name = "karyos-catalog"
path = "src/bin/karyos-catalog.rs"

[[bin]]
name = "karyos-replay"
path = "src/bin/karyos-replay.rs"

[[bin]]
name = "karyos-stat"
path = "src/bin/karyos-stat.rs"

[[bin]]
name = "karyos-errors"
path = "src/bin/karyos-errors.rs"

[[bin]]
name = "karyos-tools"
path = "src/bin/karyos-tools.rs"

# The conformance suite's incompatible driver (FORMAT.md, Incompatible
# driver): a test-kit binary only.
[[bin]]
name = "karyos-admission-stub"
path = "src/bin/karyos-admission-stub.rs"
required-features = ["test-hooks"]

# Not documented: its rustdoc output would collide with the karyos-trace
# library's (target/doc/karyos_trace); its logic is documented in the
# library's `trace` module.
[[bin]]
name = "karyos-trace"
path = "src/bin/karyos-trace.rs"
doc = false

[lints]
workspace = true
