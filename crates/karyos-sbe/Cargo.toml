# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-sbe"
description = "SBE 1.0 framing and feed adapters over Karyos, through IronSBE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The SBE adapters plug into the feed's A/B arbitration (SPEC §7.2, §10.1):
# `karyos-sbe` depends on `karyos-feed`, never the reverse, which
# `make sbe-graph-check` enforces (karyos#631). The IronSBE crates admitted
# by quantstratum-docs karyos/reviews/dependency-admission-ironsbe.md are
# pinned exactly (`=0.9.1`, the record's condition 1), `ironsbe-codegen` as a
# build dependency only (karyos#646). `ironsbe-schema` is not taken: only the
# generator reads the schemas, at build time, and it brings the parser
# itself.
[dependencies]
karyos-feed = { path = "../karyos-feed" }
ironsbe-core = "=0.9.1"
thiserror.workspace = true

[build-dependencies]
ironsbe-codegen = "=0.9.1"

[dev-dependencies]
karyos-sys = { workspace = true, features = ["alloc-count"] }

[lints]
workspace = true
