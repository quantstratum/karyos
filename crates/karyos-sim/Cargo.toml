# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-sim"
description = "Deterministic simulator, including the backend ring models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
karyos-sys.workspace = true
karyos-client.workspace = true
karyos-protocol.workspace = true
karyos-driver.workspace = true
karyos-archive.workspace = true
karyos-cluster.workspace = true

[features]
# The C5 allocation probe (harness::probe, tests/allocation.rs; karyos#691):
# it needs karyos-sys's counting allocator, a test hook, so the library
# builds without it unless asked.
alloc-probe = ["karyos-sys/test-hooks"]

[dev-dependencies]
# The scripted sockets of the timed scenarios (tests/timed.rs).
karyos-io = { workspace = true, features = ["test-hooks"] }
# The read pause points of the stall test with an asynchronous Archive
# (tests/stall_isolation_archive.rs).
karyos-sys = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "allocation"
required-features = ["alloc-probe"]

[lints]
workspace = true
