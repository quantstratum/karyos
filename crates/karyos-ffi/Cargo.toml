# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-ffi"
description = "The C ABI: libkaryos as a shared and a static library, with a committed C header."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The library is `karyos_ffi`: `karyos` would collide with the facade's
# rlib in the shared target directory. The release packaging names the
# artifacts `libkaryos` (SPEC.md §10.2). The rlib lets the crate's own tests
# link the exported symbols.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The Archive's control transports and catalog listing (F9a;
# quantstratum-docs: karyos/design/ffi-archive.md).
karyos-archive.workspace = true
karyos-client.workspace = true
# The embedded driver the C ABI exports (F5; SPEC.md §14 crate table).
karyos-driver.workspace = true
karyos-protocol.workspace = true
karyos-sys.workspace = true

[features]
# The conformance test kit's fault hook (`include/karyos_test_hooks.h`):
# a duty cycle that panics, for the panic row of the suite. Never in a
# product build; `make test-hooks-absent-check` proves the release
# library has none of it.
test-hooks = []

[dev-dependencies]
# The production Archive host (H2, H2b) for a gap recovered through a real
# Archive over the C ABI (#549): tests only, never a normal edge, so the
# published crate gains no dependency.
karyos-tools.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The admission socket of the connect tests' fake driver.
karyos-protocol.workspace = true

# The workspace lint set with `unsafe_code` denied instead of forbidden: only
# the boundary module `abi` (and the tests' `support::abi`) may `expect` it
# (SPEC.md §10.2, §14; ADR-0053). `make lint-sync` checks this table.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
# `karyos_package`: the conformance test links a released libkaryos
# package instead of this crate (scripts/conformance-package.sh).
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(karyos_package)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
