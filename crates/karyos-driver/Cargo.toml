[package]
name = "karyos-driver"
description = "Driver conductor, sender, receiver, flow control and path arbitration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Guard and abort authority (owner decision D51; quantstratum-docs:
# karyos/reviews/dependency-admission-wire-auth-hmac.md, driver scope).
ed25519-dalek.workspace = true
hmac.workspace = true
sha2.workspace = true
zeroize.workspace = true
karyos-client.workspace = true
karyos-io.workspace = true
karyos-protocol.workspace = true
karyos-sys.workspace = true
thiserror.workspace = true

[features]
# Hooks only tests use: hidden API, never in a release build (karyos#852).
test-hooks = []

[dev-dependencies]
karyos-driver = { path = ".", features = ["test-hooks"] }
karyos-io = { workspace = true, features = ["test-hooks"] }
karyos-sys = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
