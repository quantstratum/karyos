# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-sys"
description = "Shared memory mappings, AtomicBuffer, rings, broadcast buffer, counters, seqlock slots, TSC and NUMA placement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Hooks for tests of dependent crates that need a broken invariant; never
# enabled outside dev-dependencies.
test-hooks = []

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

# The workspace lint set without `unsafe_code = "forbid"`, plus the unsafe
# rules of SPEC.md §14. Keep the clippy list in sync with the workspace.
[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
