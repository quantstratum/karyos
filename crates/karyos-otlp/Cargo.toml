# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-otlp"
description = "OTLP metrics export of the agent's view: karyos-exporter's metrics pushed to an OpenTelemetry collector over OTLP/HTTP (karyos#706)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The opentelemetry admission record (quantstratum-docs:
# karyos/reviews/dependency-admission-opentelemetry.md, owner decision ACS
# 71206): these crates, at these versions and features, in this crate only.
# Nothing depends on it, and it is not a default member (conditions 1, 2).
# `hyper`, `hyper-util` and `tokio` are the agent HTTP stack record's, at
# its versions; `hyper`'s `client` is this record's widening (condition 5).
[dependencies]
karyos-agent = { path = "../karyos-agent" }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "metrics"] }
opentelemetry-http = { version = "=0.33.1", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }
async-trait = { version = "=0.1.92" }
bytes = { version = "1.12.1", default-features = false }
thiserror.workspace = true

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = { version = "=0.14.4", default-features = false, features = ["std"] }

[lints]
workspace = true
