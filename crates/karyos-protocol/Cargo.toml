# SPDX-License-Identifier: Apache-2.0

[package]
name = "karyos-protocol"
description = "Frame layouts, flyweights and channel URI parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["ipc", "messaging", "low-latency", "shared-memory", "trading"]
categories = ["network-programming", "concurrency"]

[features]
# Hooks for tests of dependent crates: the `Synthetic` test profile of the
# protection seam, for the measurement harness self-check. Never enabled
# in a release build.
test-hooks = []

[dependencies]
# AES-256-GCM-SIV of the encrypted profile (ADR-0114), detached and in place.
aes-gcm-siv.workspace = true
# Declared only to enable `zeroize`, so the AES-256 and POLYVAL key
# schedules inside `aes-gcm-siv` are erased on drop.
aes.workspace = true
polyval.workspace = true
karyos-sys.workspace = true
# `zeroize` erases the keyed SHA-256 states of the HMAC profile on drop.
sha2 = { workspace = true, features = ["zeroize"] }
thiserror.workspace = true
# Erases the padded HMAC key blocks (no `alloc`).
zeroize.workspace = true

[dev-dependencies]
karyos-sys = { workspace = true, features = ["test-hooks"] }
# The second HKDF-SHA-256 the erasing `protection::hkdf` is checked against.
hkdf.workspace = true
proptest.workspace = true

[lints]
workspace = true
