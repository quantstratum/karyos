[package]
name = "karyos-trace"
description = "Trace context, bounded journals, clock calibration and HDR aggregation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Published for its first consumer, karyos-insights (ADR-0068, INS-Q4;
# karyos#997).
publish = true
readme = "README.md"
keywords = ["tracing", "latency", "histogram", "messaging", "low-latency"]
categories = ["development-tools::profiling", "network-programming"]

[dependencies]
karyos-protocol.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The counting allocator of the no-allocation test.
karyos-sys = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
