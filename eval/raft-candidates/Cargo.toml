# SPDX-License-Identifier: Apache-2.0
# The Raft candidates' evaluation crate: evaluation only, never shipped
# (quantstratum-docs:
# karyos/reviews/dependency-admission-raft-candidates-evaluation.md;
# karyos#677). Its own workspace, lockfile and deny.toml keep the
# candidates out of the core's graph; make shipped-graph-check proves it.

[workspace]

[package]
name = "karyos-raft-eval"
description = "Evaluation adapters of the Raft candidates behind the karyos-sim harness; never shipped."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/quantstratum/karyos"
publish = false

[dependencies]
karyos-sim = { path = "../../crates/karyos-sim" }
karyos-cluster = { path = "../../crates/karyos-cluster" }
# StdDisk: C4's log on real files for the real-process runs.
karyos-archive = { path = "../../crates/karyos-archive" }
# Admitted for evaluation: exactly 0.7.0, default features off
# (no default-logger), protobuf-codec only.
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
# raft-proto's codec, already in raft's graph: encodes raft-rs messages
# between real processes.
protobuf = { version = "=2.28.0", default-features = false }
# Admitted for evaluation: exactly 0.10.0-alpha.37, default features off
# (no tokio-rt); the lockfile pins openraft-macros to 0.10.0-alpha.37.
openraft = { version = "=0.10.0-alpha.37", default-features = false }
openraft-rt = { version = "=0.10.0-alpha.37", default-features = false }
# The channels and the async mutex behind the executor's openraft-rt
# runtime, already in openraft-rt's graph.
futures-channel = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The executor's seeded RNG (openraft-rt's ThreadLocalRng), already in
# openraft-rt's graph.
rand = { version = "0.10.4", default-features = false, }
# raft's own logger crate, already in its graph: RawNode::new takes a
# slog::Logger, given a discarding one.
slog = { version = "2.8.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dev-dependencies]
# The allocation gate's probe (karyos-sim harness::probe) and the
# counting allocator it needs (ADR-0008).
# The fault injection of tests/checks.rs (karyos#1038).
karyos-sim = { path = "../../crates/karyos-sim", features = ["alloc-probe", "test-hooks"] }
karyos-sys = { path = "../../crates/karyos-sys", features = ["test-hooks"] }
