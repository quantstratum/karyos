# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = [
    "crates/karyos-sys",
    "crates/karyos-io",
    "crates/karyos-protocol",
    "crates/karyos-codec",
    "crates/karyos-client",
    "crates/karyos-driver",
    "crates/karyos-trace",
    "crates/karyos-archive",
    "crates/karyos-cluster",
    "crates/karyos-feed",
    "crates/karyos-sim",
    "crates/karyos",
    "crates/karyos-tools",
    "crates/karyos-ffi",
    "crates/karyos-bench",
    "crates/karyos-agent",
    "crates/karyos-control",
]
# Every member but the control-plane component (karyos#708): the default
# build and its graph are unchanged by it (the agent HTTP stack's admission
# record, condition 2).
default-members = [
    "crates/karyos-sys",
    "crates/karyos-io",
    "crates/karyos-protocol",
    "crates/karyos-codec",
    "crates/karyos-client",
    "crates/karyos-driver",
    "crates/karyos-trace",
    "crates/karyos-archive",
    "crates/karyos-cluster",
    "crates/karyos-feed",
    "crates/karyos-sim",
    "crates/karyos",
    "crates/karyos-tools",
    "crates/karyos-ffi",
    "crates/karyos-bench",
    "crates/karyos-agent",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/quantstratum/karyos"
publish = false

[workspace.dependencies]
karyos-sys = { path = "crates/karyos-sys", version = "0.1.0-alpha.3" }
karyos-io = { path = "crates/karyos-io", version = "0.1.0-alpha.3" }
karyos-protocol = { path = "crates/karyos-protocol", version = "0.1.0-alpha.3" }
karyos-codec = { path = "crates/karyos-codec", version = "0.1.0-alpha.3" }
karyos-client = { path = "crates/karyos-client", version = "0.1.0-alpha.3" }
karyos-driver = { path = "crates/karyos-driver", version = "0.1.0-alpha.3" }
karyos-trace = { path = "crates/karyos-trace", version = "0.1.0-alpha.3" }
karyos-archive = { path = "crates/karyos-archive", version = "0.1.0-alpha.3" }
karyos-cluster = { path = "crates/karyos-cluster", version = "0.1.0-alpha.3" }
karyos-sim = { path = "crates/karyos-sim", version = "0.1.0-alpha.3" }
karyos = { path = "crates/karyos", version = "0.1.0-alpha.3" }
karyos-tools = { path = "crates/karyos-tools", version = "0.1.0-alpha.3" }
karyos-agent = { path = "crates/karyos-agent", version = "0.1.0-alpha.3" }

# External dependencies; each admission is recorded in deps/dependencies.md.
loom = { version = "0.7.2", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "mm", "net", "param", "process", "rand", "time"] }
signal-hook = { version = "0.4.5", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }

# Inherited by every crate except karyos-sys and karyos-io (SPEC.md §14).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
debug = "line-tables-only"
